<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature App</title>
    <!-- Menyertakan file CSS Bootstrap untuk styling -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Menyertakan file jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        /* Gaya untuk body halaman */
        body {
            background-color: #a3d5f1; 
        }
        /* Gaya untuk kotak tanda tangan */
        .signature-box {
            border: 1px solid #b6a3a3;
            padding: 10px;
            border-radius: 5px;
            background-color:rgb(96, 96, 136);
            white-space: pre-wrap; /* Mempertahankan spasi dan baris baru */
            overflow-wrap: break-word; /* Memecah kata yang panjang */
        }
        /* Gaya untuk tombol salin */
        .copy-button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Tanda Tangan Digital Menggunakan MD5 dan RSA</h1>
        <h1>Kelompok 9</h1>

        <!-- Bagian untuk mengunggah dokumen -->
        <h2>Upload Document</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <!-- Input file untuk dokumen -->
                <input type="file" name="file" class="form-control" required>
            </div>
            <!-- Tombol untuk mengunggah dokumen -->
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <div id="uploadResult" class="mt-3"></div>

        <!-- Bagian untuk menandatangani pesan -->
        <h2 class="mt-5">Sign Message</h2>
        <form id="signMessageForm">
            <div class="form-group">
                <!-- Textarea untuk memasukkan pesan yang akan ditandatangani -->
                <textarea name="message" class="form-control" rows="3" placeholder="Enter your message" required></textarea>
            </div>
            <!-- Tombol untuk menandatangani pesan -->
            <button type="submit" class="btn btn-primary">Sign Message</button>
        </form>
        <div id="signMessageResult" class="mt-3"></div>

        <!-- Bagian untuk memverifikasi pesan -->
        <h2 class="mt-5">Verify Message</h2>
        <form id="verifyMessageForm">
            <div class="form-group">
                <!-- Textarea untuk memasukkan pesan yang akan diverifikasi -->
                <textarea name="verifyMessage" class="form-control" rows="3" placeholder="Enter your message" required></textarea>
            </div>
            <div class="form-group">
                <!-- Textarea untuk memasukkan tanda tangan yang akan diverifikasi -->
                <textarea name="signature" class="form-control" rows="3" placeholder="Enter signature" required></textarea>
            </div>
            <!-- Tombol untuk memverifikasi pesan -->
            <button type="submit" class="btn btn-primary">Verify Message</button>
        </form>
        <div id="verifyMessageResult" class="mt-3"></div>

        <!-- Bagian untuk memverifikasi dokumen -->
        <h2 class="mt-5">Verify Document</h2>
        <form id="verifyDocumentForm">
            <div class="form-group">
                <!-- Input untuk memasukkan nama file dokumen yang akan diverifikasi -->
                <input type="text" name="filename" class="form-control" placeholder="Enter filename" required>
            </div>
            <div class="form-group">
                <!-- Textarea untuk memasukkan tanda tangan dokumen yang akan diverifikasi -->
                <textarea name="documentSignature" class="form-control" rows="3" placeholder="Enter document signature" required></textarea>
            </div>
            <!-- Tombol untuk memverifikasi dokumen -->
            <button type="submit" class="btn btn-primary">Verify Document</button>
        </form>
        <div id="verifyDocumentResult" class="mt-3"></div>

        <!-- Bagian untuk menampilkan daftar dokumen -->
        <h2 class="mt-5">Daftar Dokumen</h2>
        <button id="toggleDocumentList" class="btn btn-secondary mb-3">Show Documents</button>
        <div id="documentList" class="mt-3" style="display: none;"></div>
    </div>

    <script>
        $(document).ready(function() {
            // Menangani pengunggahan dokumen
            $('#uploadForm').on('submit', function(e) {
                e.preventDefault();
                var formData = new FormData(this);
                $.ajax({
                    url: '/upload',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        // Menampilkan hasil pengunggahan termasuk tanda tangan dokumen
                        $('#uploadResult').html('<span class="text-info">' + response.message + '</span><br><span>Signature: <div class="signature-box">' + response.signature + '</div><button class="btn btn-secondary copy-button" onclick="copyToClipboard(\'' + response.signature + '\')">Copy</button></span>');
                        loadDocuments(); // Memuat ulang daftar dokumen
                    },
                    error: function() {
                        $('#uploadResult').html('<span class="text-danger">Upload failed.</span>');
                    }
                });
            });

            // Menangani penandatanganan pesan
            $('#signMessageForm').on('submit', function(e) {
                e.preventDefault();
                var message = $(this).find('textarea[name="message"]').val();
                $.ajax({
                    url: '/sign_message',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: message }),
                    success: function(response) {
                        // Menampilkan tanda tangan pesan
                        $('#signMessageResult').html('<span class="text-info">Signature: <div class="signature-box">' + response.signature + '</div><button class="btn btn-secondary copy-button" onclick="copyToClipboard(\'' + response.signature + '\')">Copy</button></span>');
                    },
                    error: function() {
                        $('#signMessageResult').html('<span class="text-danger">Signing failed.</span>');
                    }
                });
            });

            // Menangani verifikasi pesan
            $('#verifyMessageForm').on('submit', function(e) {
                e.preventDefault();
                var message = $(this).find('textarea[name="verifyMessage"]').val();
                var signature = $(this).find('textarea[name="signature"]').val();
                $.ajax({
                    url: '/verify_message',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: message, signature: signature }),
                    success: function(response) {
                        $('#verifyMessageResult').html('<span class="text-info">' + response.message + '</span>');
                    },
                    error: function() {
                        $('#verifyMessageResult').html('<span class="text-danger">Verification failed.</span>');
                    }
                });
            });

            // Menangani verifikasi dokumen
            $('#verifyDocumentForm').on('submit', function(e) {
                e.preventDefault();
                var filename = $(this).find('input[name="filename"]').val();
                var documentSignature = $(this).find('textarea[name="documentSignature"]').val();
                $.ajax({
                    url: '/verify_document',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ filename: filename, signature: documentSignature }),
                    success: function(response) {
                        $('#verifyDocumentResult').html('<span class="text-info">' + response.message + '</span>');
                    },
                    error: function() {
                        $('#verifyDocumentResult').html('<span class="text-danger">Document verification failed.</span>');
                    }
                });
            });

            // Memuat daftar dokumen
            function loadDocuments() {
                $.ajax({
                    url: '/documents',
                    type: 'GET',
                    success: function(response) {
                        var documentList = $('#documentList');
                        documentList.empty();
                        response.documents.forEach(function(doc) {
                            documentList.append('<div class="alert alert-info">Filename: ' + doc.filename + '<br>Signature: <div class="signature-box">' + doc.signature + '</div><button class="btn btn-secondary copy-button" onclick="copyToClipboard(\'' + doc.signature + '\')">Copy</button></div>');
                        });
                    },
                    error: function() {
                        $('#documentList').html('<span class="text-danger">Gagal mengambil dokumen.</span>');
                    }
                });
            }

            // Memuat daftar dokumen saat halaman dimuat
            loadDocuments();

            // Menangani tombol untuk menampilkan atau menyembunyikan daftar dokumen
            $('#toggleDocumentList').on('click', function() {
                $('#documentList').toggle();
                var buttonText = $('#documentList').is(':visible') ? 'Hide Documents' : 'Show Documents';
                $(this).text(buttonText);
            });
        });

        // Fungsi untuk menyalin teks ke clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Signature copied to clipboard!');
            }, function(err) {
                alert('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
